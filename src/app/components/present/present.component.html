<div class="present_container">

    <section class="present_menu_section">
        <div class="button_container">
            <button mat-icon-button>
                <i class="fa fa-arrow-pointer"></i>
            </button>
            <button mat-icon-button>
                <mat-icon>draw</mat-icon>
            </button>
            <button mat-icon-button>
                <i class="fa-solid fa-highlighter"></i>
            </button>
            <button mat-icon-button>
                <i class="fa-solid fa-eraser"></i>
            </button>
            <button mat-icon-button [matMenuTriggerFor]="shape">
                <mat-icon>shape_line</mat-icon>
            </button>

            <!-- 그리기 도구 -->
            <mat-menu #shape="matMenu" xPosition="before">
                <article class="shape_tool">
                    <button mat-icon-button>
                        <mat-icon>remove</mat-icon>
                    </button>
                    <button mat-icon-button>
                        <mat-icon>radio_button_unchecked</mat-icon>
                    </button>
                    <button mat-icon-button>
                        <mat-icon>crop_square</mat-icon>
                    </button>
                </article>
            </mat-menu>

            <div class="divide"></div>

            <button class="color_button" style="background-color: black;">

            </button>

            <button class="color_button" style="background-color: red;">

            </button>

            <button class="color_button" style="background-color: blue;">

            </button>

            <button class="color_button" style="background-color: green;">

            </button>

            <button class="color_button" style="background-color: yellow;">

            </button>

            <button class="width_button big">

            </button>

            <button class="width_button medium">
            </button>

            <button class="width_button small">

            </button>
        </div>

    </section>
    <section id="present" class="present_section">
        <!-- 캔버스 영역 -->
        <div></div>

        <!-- 메뉴 -->
        <div class="menu_container">
            <button mat-icon-button class="video_menu">
                <mat-icon>more_vert</mat-icon>
            </button>
            <article class="video_user_name">
                이름
            </article>
        </div>
        <!-- 비디오 -->
        <video id="present_video" (resize)="videoResize($event.target)" class="present_video" [srcObject]="videoStream"
            autoplay></video>


    </section>


</div>
