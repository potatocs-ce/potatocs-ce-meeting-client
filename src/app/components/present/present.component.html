<div class="present_container">

    <section class="present_menu_section">
        <div class="button_container">
            <button (click)="setType('click')" mat-icon-button [ngClass]="tool.type == 'click' ? 'active': ''">
                <i class="fa fa-arrow-pointer"></i>
            </button>
            <button (click)="setType('pen')" mat-icon-button [ngClass]="tool.type == 'pen' ? 'active': ''">
                <mat-icon>draw</mat-icon>
            </button>
            <button (click)="setType('highlighter')" mat-icon-button
                [ngClass]="tool.type == 'highlighter' ? 'active': ''">
                <i class="fa-solid fa-highlighter"></i>
            </button>
            <button (click)="setType('eraser')" (dblclick)="clearDrawing()" mat-icon-button
                [ngClass]=" tool.type=='eraser' ? 'active' : ''">
                <i class=" fa-solid fa-eraser"></i>
            </button>
            <button mat-icon-button [matMenuTriggerFor]="shape"
                [ngClass]="tool.type == 'line' || tool.type == 'circle' || tool.type == 'rectangle' ? 'active': ''">
                <mat-icon>shape_line</mat-icon>
            </button>

            <!-- 그리기 도구 -->
            <mat-menu #shape="matMenu">
                <article class="shape_tool">
                    <button (click)="setType('line')" mat-icon-button [ngClass]="tool.type == 'line' ? 'active': ''">
                        <mat-icon>remove</mat-icon>
                    </button>
                    <button (click)="setType('circle')" mat-icon-button [ngClass]="tool.type == 'circle'? 'active': ''">
                        <mat-icon>panorama_fish_eye</mat-icon>
                    </button>
                    <button (click)="setType('rectangle')" mat-icon-button
                        [ngClass]="tool.type == 'rectangle' ? 'active': ''">
                        <mat-icon>crop_din</mat-icon>
                    </button>
                </article>
            </mat-menu>

            <div class="divide"></div>



            <button (click)="setColor('black')" class="color_button" style="background-color: black;">
                @if(tool.color == 'black'){
                <p> <i class="fas fa-check check"></i></p>

                }
            </button>



            <button (click)="setColor('red')" class="color_button" style="background-color: red;">
                @if(tool.color == 'red'){
                <p><i class="fas fa-check check"></i></p>
                }
            </button>

            <button (click)="setColor('blue')" class="color_button" style="background-color: blue;">
                @if(tool.color == 'blue'){
                <p>
                    <i class="fas fa-check check"></i>
                </p>

                }
            </button>

            <button (click)="setColor('green')" class="color_button" style="background-color: green;">
                @if(tool.color == 'green'){
                <p>
                    <i class="fas fa-check check"></i>
                </p>

                }
            </button>

            <button (click)="setColor('yellow')" class="color_button" style="background-color: yellow;">
                @if(tool.color == 'yellow'){
                <p>
                    <i class="fas fa-check check" style="color: black"></i>
                </p>

                }
            </button>

            <div class="divide"></div>

            <button (click)="setWidth(10)" class="width_button big">
                @if(tool.width == 10){
                <p>
                    <i class="fas fa-check check" style="color: black"></i>
                </p>
                }
            </button>

            <button (click)="setWidth(5)" class="width_button medium">
                @if(tool.width == 5){
                <p>
                    <i class="fas fa-check check" style="color: black"></i>
                </p>
                }
            </button>

            <button (click)="setWidth(1)" class="width_button small">
                @if(tool.width == 1){
                <p>
                    <i class="fas fa-check check" style="color: black"></i>
                </p>
                }
            </button>

        </div>
    </section>

    <div class="present_section_container">
        <section id="present" class="present_section">
            <!-- 비디오 -->
            <video id="present_video" [class]="videoStream?.id" #present_video (resize)="videoResize($event.target)"
                class="present_video" [srcObject]="videoStream?.stream" autoplay playsInline muted></video>
            <!-- 메뉴 -->
            <article class="menu_container" [class]="videoStream?.socket_id"
                [ngClass]="tool.type === 'click' ? 'main':''">
                <button mat-icon-button class="video_menu" [matMenuTriggerFor]="videoMenu">
                    <mat-icon>more_vert</mat-icon>
                </button>
                <mat-menu #videoMenu="matMenu" xPosition="before">
                    <button mat-menu-item (click)="capture(present_video)">
                        <mat-icon>screenshot_monitor</mat-icon>
                        <span>screenshot</span>
                    </button>
                </mat-menu>
                @if(videoStream?.name){
                <div class="video_user_name">
                    {{videoStream?.name}}
                </div>
                }

            </article>

            <!-- 캔버스 영역 -->
            <div class="canvas_container" [ngClass]="tool.type !== 'click' ? 'main':''">
                <section class="canvas_section" [id]="videoStream?.user_id">
                    <!-- 그려진 데이터가 보여질 부분 -->
                    <canvas id="data_canvas" class="data_canvas"></canvas>
                    <!-- 상대방으로 부터 수신 받을 판서 데이터가 보여질 부분 -->
                    <canvas id="target_canvas" class="target_canvas"></canvas>
                    <!-- 그림 그리는 부분 -->
                    <canvas id="drawing_canvas" class="drawing_canvas"></canvas>
                </section>
            </div>
        </section>
    </div>



</div>
