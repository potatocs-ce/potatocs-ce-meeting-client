<div class="result_container">
    <app-card>
        <h3 class="title">응답: {{result.length}} 개</h3>
    </app-card>

    @for(card of survey.cards; track card; let idx = $index) {
    <app-card>

        <h4>{{card.item_title}}</h4>



        <div style="height: 300px;">
            <canvas baseChart [data]="my_data[idx]" [legend]="false" [options]="chartOptions" [type]="'bar'"></canvas>
        </div>

    </app-card>
    }
</div>
